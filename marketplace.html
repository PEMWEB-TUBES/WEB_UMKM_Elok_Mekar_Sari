<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace - Elok Mekar Sari</title>
  <meta name="description" content="Jelajahi produk segar dari UMKM Elok Mekar Sari - Olahan jamur, lele, dan minuman tradisional">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="home.html" class="nav-brand">
        <span class="brand-text">Elok Mekar Sari</span>
      </a>
      <div class="nav-links">
        <a href="home.html" class="nav-link">Beranda</a>
        <a href="marketplace.html" class="nav-link active">Produk</a>
        <a href="orders.html" class="nav-link">Pesanan</a>
        <a href="profile.html" class="nav-link">Profil</a>
      </div>
      <div class="nav-actions">
        <a href="cart.html" class="nav-cart" title="Keranjang">
          <img src="Icon/keranjang.png" alt="Keranjang" class="nav-icon-img">
          <span class="cart-badge" id="cart-badge">0</span>
        </a>
        <div class="nav-user" onclick="toggleUserMenu()">
          <div class="nav-avatar" id="nav-avatar">U</div>
          <div class="user-dropdown" id="user-dropdown">
            <div class="dropdown-header">
              <div class="dropdown-avatar" id="dropdown-avatar">U</div>
              <div>
                <div class="dropdown-name" id="dropdown-name">Pengguna</div>
                <div class="dropdown-email" id="dropdown-email">user@email.com</div>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <a href="profile.html" class="dropdown-item"><img src="Icon/person.png" alt="" class="dropdown-icon-img"> Profil Saya</a>
            <a href="orders.html" class="dropdown-item">📦 Pesanan Saya</a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-btn" onclick="logout()">Keluar</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <div class="page-header">
    <div class="container">
      <h1 class="page-title"><img src="Icon/keranjang.png" alt="" class="title-icon-img" style="filter: brightness(0) invert(1);"> Marketplace</h1>
      <p class="page-sub">Temukan produk segar berkualitas dari Elok Mekar Sari</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="marketplace-layout">
    <!-- Sidebar Filter -->
    <aside class="filter-sidebar" id="filter-sidebar">
      <div class="filter-header">
        <h3>Filter</h3>
        <button class="filter-reset" onclick="resetFilters()">Reset</button>
      </div>

      <!-- Search -->
      <div class="filter-section">
        <label class="filter-label">Cari Produk</label>
        <div class="search-input-wrapper">
          <img src="Icon/search.png" alt="Cari" class="search-icon-img">
          <input type="text" id="search-input" placeholder="Nama produk..." oninput="filterProducts()">
        </div>
      </div>

      <!-- Category -->
      <div class="filter-section">
        <label class="filter-label">Kategori</label>
        <div class="filter-options">
          <button class="filter-btn active" data-cat="all" onclick="setCategory('all', this)">Semua</button>
          <button class="filter-btn" data-cat="jamur" onclick="setCategory('jamur', this)"><img src="Icon/mushroom.png" alt="" class="filter-icon-img"> Olahan Jamur</button>
          <button class="filter-btn" data-cat="lele" onclick="setCategory('lele', this)"><img src="Icon/fish.png" alt="" class="filter-icon-img"> Olahan Lele</button>
          <button class="filter-btn" data-cat="minuman" onclick="setCategory('minuman', this)"><img src="Icon/drink.png" alt="" class="filter-icon-img"> Minuman</button>
          <button class="filter-btn" data-cat="lainnya" onclick="setCategory('lainnya', this)"><img src="Icon/gandum.png" alt="" class="filter-icon-img"> Lainnya</button>
        </div>
      </div>

      <!-- Price Range -->
      <div class="filter-section">
        <label class="filter-label">Harga</label>
        <div class="price-inputs">
          <input type="number" id="price-min" placeholder="Min" oninput="filterProducts()">
          <span>-</span>
          <input type="number" id="price-max" placeholder="Max" oninput="filterProducts()">
        </div>
      </div>

      <!-- Sort -->
      <div class="filter-section">
        <label class="filter-label">Urutkan</label>
        <select id="sort-select" onchange="filterProducts()" class="filter-select">
          <option value="default">Default</option>
          <option value="price-asc">Harga Terendah</option>
          <option value="price-desc">Harga Tertinggi</option>
          <option value="name-asc">Nama A-Z</option>
          <option value="name-desc">Nama Z-A</option>
        </select>
      </div>
    </aside>

    <!-- Products Area -->
    <main class="marketplace-main">
      <!-- Mobile Filter Toggle -->
      <div class="mobile-filter-bar">
        <button class="mobile-filter-btn" onclick="toggleMobileFilter()">
          🔽 Filter
        </button>
        <div class="result-count" id="result-count">10 produk ditemukan</div>
        <select id="sort-mobile" onchange="document.getElementById('sort-select').value=this.value; filterProducts()" class="mobile-sort-select">
          <option value="default">Urutkan</option>
          <option value="price-asc">Harga ↑</option>
          <option value="price-desc">Harga ↓</option>
          <option value="name-asc">A-Z</option>
        </select>
      </div>

      <!-- Products Grid -->
      <div class="products-grid" id="products-grid">
        <!-- Filled by JS -->
      </div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="empty-state">
        <div class="empty-icon"><img src="Icon/search.png" alt="Tidak Ditemukan" class="empty-icon-img"></div>
        <h3>Produk Tidak Ditemukan</h3>
        <p>Coba ubah filter atau kata kunci pencarian Anda</p>
        <button class="btn-primary" onclick="resetFilters()">Reset Filter</button>
      </div>
    </main>
  </div>

  <!-- Product Detail Modal -->
  <div class="modal-overlay hidden" id="product-modal" onclick="closeModal(event)">
    <div class="modal-content product-modal">
      <button class="modal-close" onclick="closeProductModal()">✕</button>
      <div class="modal-product-layout">
        <div class="modal-product-image">
          <img id="modal-img" src="" alt="">
        </div>
        <div class="modal-product-info">
          <div class="modal-category" id="modal-category"></div>
          <h2 class="modal-product-name" id="modal-name"></h2>
          <div class="modal-price" id="modal-price"></div>
          <p class="modal-desc" id="modal-desc"></p>
          <div class="modal-stock" id="modal-stock"></div>
          <div class="modal-qty">
            <label>Jumlah:</label>
            <div class="qty-control">
              <button onclick="changeQty(-1)">−</button>
              <input type="number" id="modal-qty" value="1" min="1" max="99">
              <button onclick="changeQty(1)">+</button>
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn-primary" onclick="addToCartFromModal()">
              <img src="Icon/keranjang.png" alt="" class="btn-icon-img" style="filter: brightness(0) invert(1);"> Tambah ke Keranjang
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
  <script src="js/marketplace.js"></script>
</body>
</html>
