<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elok Mekar Sari - Masuk / Daftar</title>
  <meta name="description" content="Masuk atau Daftar akun di Marketplace resmi UMKM Elok Mekar Sari Surabaya.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <div class="auth-brand-header">
        <h1 class="brand-title">ELOK MEKAR SARI</h1>
        <p class="brand-subtitle">Marketplace UMKM Kelompok Tani Surabaya</p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login" onclick="showTab('login')">Masuk</button>
        <button type="button" class="auth-tab" id="tab-register" onclick="showTab('register')">Daftar</button>
      </div>

      <!-- Login Form -->
      <div class="auth-form" id="form-login">
        <div class="form-header-text">
          <h2 class="auth-form-title">Selamat Datang Kembali</h2>
          <p class="auth-form-sub">Silakan masuk ke akun Anda untuk mulai berbelanja</p>
        </div>

        <form id="login-form" novalidate onsubmit="login(event)">
          <div class="form-group">
            <label for="login-email">Email / ID Pengguna</label>
            <div class="input-wrapper">
              <span class="input-icon"><img src="Icon/email.png" alt="Email" class="form-icon-img"></span>
              <input type="text" id="login-email" placeholder="nama@email.com" required autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon"><img src="Icon/password.png" alt="Password" class="form-icon-img"></span>
              <input type="password" id="login-password" placeholder="Masukkan password" required autocomplete="current-password">
              <button type="button" class="password-toggle" onclick="togglePassword('login-password', this)" title="Lihat password">
                <img src="Icon/invisible.png" alt="Lihat password" class="password-toggle-img">
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me"> Ingat saya
            </label>
            <a href="lupa-password.html" class="forgot-link">Lupa password?</a>
          </div>

          <button type="submit" class="btn-auth" id="login-btn">
            <span>Masuk Sekarang</span>
            <span class="btn-arrow">→</span>
          </button>
        </form>

        <div class="auth-divider"><span>atau</span></div>

        <!-- Google Login Button -->
        <div class="social-auth">
          <button type="button" class="btn-google" onclick="loginWithGoogle()">
            <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Masuk dengan Google</span>
          </button>
        </div>
      </div>

      <!-- Register Form -->
      <div class="auth-form hidden" id="form-register">
        <div class="form-header-text">
          <h2 class="auth-form-title">Buat Akun Baru</h2>
          <p class="auth-form-sub">Daftar sekarang untuk berbelanja produk segar UMKM</p>
        </div>

        <form id="register-form" onsubmit="register(event)">
          <div class="form-group">
            <label for="reg-name">Nama Lengkap</label>
            <div class="input-wrapper">
              <span class="input-icon"><img src="Icon/person.png" alt="Nama" class="form-icon-img"></span>
              <input type="text" id="reg-name" placeholder="Nama lengkap Anda" required>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-email">Email</label>
            <div class="input-wrapper">
              <span class="input-icon"><img src="Icon/email.png" alt="Email" class="form-icon-img"></span>
              <input type="email" id="reg-email" placeholder="nama@email.com" required autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <label for="reg-phone">Nomor Telepon / WhatsApp</label>
            <div class="input-wrapper">
              <span class="input-icon"><img src="Icon/hp.png" alt="Telepon" class="form-icon-img"></span>
              <input type="tel" id="reg-phone" placeholder="08xxxxxxxxxx" required>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon"><img src="Icon/password.png" alt="Password" class="form-icon-img"></span>
              <input type="password" id="reg-password" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password">
              <button type="button" class="password-toggle" onclick="togglePassword('reg-password', this)" title="Lihat password">
                <img src="Icon/invisible.png" alt="Lihat password" class="password-toggle-img">
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-confirm">Konfirmasi Password</label>
            <div class="input-wrapper">
              <span class="input-icon"><img src="Icon/password.png" alt="Konfirmasi Password" class="form-icon-img"></span>
              <input type="password" id="reg-confirm" placeholder="Ulangi password" required minlength="6" autocomplete="new-password">
              <button type="button" class="password-toggle" onclick="togglePassword('reg-confirm', this)" title="Lihat password">
                <img src="Icon/invisible.png" alt="Lihat password" class="password-toggle-img">
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" required> Saya setuju dengan syarat dan ketentuan
            </label>
          </div>

          <button type="submit" class="btn-auth">
            <span>Daftar Sekarang</span>
            <span class="btn-arrow">→</span>
          </button>
        </form>

        <div class="auth-divider"><span>atau</span></div>

        <!-- Google Register Button -->
        <div class="social-auth">
          <button type="button" class="btn-google" onclick="loginWithGoogle()">
            <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Daftar dengan Google</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="js/auth.js"></script>
</body>
</html>
